name: package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: python -m pip install ".[test]"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Verify release files
        run: physinfobench-verify --benchmark-root .
      - name: Replay reference metrics
        run: physinfobench-replay-reference --benchmark-root . --output-dir runs/reference-replay
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir wheelhouse .
