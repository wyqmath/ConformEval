[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "confomeval"
version = "0.4.0"
description = "Fixed benchmark data and evaluation utilities for protein physical inference tasks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26.4,<3", "scipy>=1.11,<2", "scikit-learn>=1.5,<2"]
authors = [{ name = "Jiayuan Ma" }]
keywords = ["protein", "benchmark", "protein-language-model", "biophysics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Repository = "https://github.com/wyqmath/ConformEval"

[project.scripts]
confomeval-evaluate = "confomeval.evaluate_predictions:main"
confomeval-build-feature-manifest = "confomeval.build_feature_manifest:main"
confomeval-fit-readers = "confomeval.run_nested_readers:main"
confomeval-evaluate-residues = "confomeval.evaluate_residue_predictions:main"
confomeval-replay-reference = "confomeval.replay_reference:main"
confomeval-fit-reference-residues = "confomeval.train_residue_reference:main"

[project.optional-dependencies]
evaluation = []
reference-residue-training = ["torch>=2.5,<3"]
test = ["scikit-learn>=1.5,<2"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
