[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "confomeval"
version = "0.5.1"
description = "Fixed benchmark data and evaluation utilities for protein physical inference tasks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26.4,<3", "scipy>=1.11,<2", "scikit-learn>=1.5,<2", "tzdata>=2024.1; sys_platform == 'win32'"]
authors = [{ name = "Jiayuan Ma" }]
keywords = ["protein", "benchmark", "protein-language-model", "biophysics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Repository = "https://github.com/wyqmath/ConformEval"

[project.scripts]
confomeval-extract = "confomeval.extract:main"
confomeval-download = "confomeval.adapters:download_main"
confomeval-prepare-inputs = "confomeval.tasks:main"
confomeval-evaluate = "confomeval.evaluate_predictions:main"
confomeval-build-feature-manifest = "confomeval.build_feature_manifest:main"
confomeval-fit-readers = "confomeval.train:main"
confomeval-evaluate-residues = "confomeval.evaluate_residue_predictions:main"
confomeval-replay-reference = "confomeval.replay_reference:main"

[project.optional-dependencies]
evaluation = []
esm2 = ["torch>=2.6,<3", "transformers>=4.48,<6", "huggingface-hub>=0.28,<2"]
prott5 = ["torch>=2.6,<3", "transformers>=4.48,<6", "huggingface-hub>=0.28,<2", "sentencepiece>=0.2,<1", "protobuf>=4,<7"]
test = ["scikit-learn>=1.5,<2"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
