[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physinfobench"
version = "0.4.0"
description = "Fixed benchmark data and evaluation utilities for protein physical inference tasks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26.4,<3", "scipy>=1.11,<2", "scikit-learn>=1.5,<2"]
authors = [{ name = "Jiayuan Ma" }]
keywords = ["protein", "benchmark", "protein-language-model", "biophysics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Repository = "https://github.com/wyqmath/ConformEval"

[project.scripts]
physinfobench-verify = "physinfobench.verify_release:main"
physinfobench-export-data = "physinfobench.export_fixed_dataset:main"
physinfobench-export-results = "physinfobench.export_esm2_reference_results:main"
physinfobench-evaluate = "physinfobench.evaluate_predictions:main"
physinfobench-build-feature-manifest = "physinfobench.build_feature_manifest:main"
physinfobench-fit-readers = "physinfobench.run_nested_readers:main"
physinfobench-evaluate-residues = "physinfobench.evaluate_residue_predictions:main"
physinfobench-replay-reference = "physinfobench.replay_reference:main"
physinfobench-fit-reference-residues = "physinfobench.run_disorder_structure_reference_evaluation_v01:main"

[project.optional-dependencies]
evaluation = []
reference-residue-training = ["torch>=2.5,<3"]
test = ["scikit-learn>=1.5,<2"]

[tool.setuptools]
packages = ["physinfobench"]
package-dir = { physinfobench = "scripts" }

[tool.unittest]
start-directory = "tests"
